services:
  storyfabric:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    secrets:
      - storyfabric_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  storyfabric_key:
    file: ./secrets/storyfabric_key
