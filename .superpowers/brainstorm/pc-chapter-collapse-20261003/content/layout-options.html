<h2>PC 端章节区收起方式</h2>
<p class="subtitle">点击你更喜欢的沉浸式码字布局。正文区域会在收起后自动扩展。</p>

<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:start">
  <div class="card" data-choice="narrow-rail" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:0;background:#f7f3eb">
      <div style="height:220px;display:flex;border:1px solid #d9d0c2;border-radius:10px;overflow:hidden;background:#fffdf8">
        <div style="width:42px;background:#f0ebe1;border-right:1px solid #d9d0c2;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px;color:#68758c">
          <div style="width:24px;height:24px;border:2px solid #68758c;border-radius:7px"></div>
          <div style="writing-mode:vertical-rl;font-size:11px;letter-spacing:2px">章节</div>
        </div>
        <div style="flex:1;padding:16px 18px;background:#fffdf8">
          <div style="height:12px;width:46%;border-radius:8px;background:#d8e2ee;margin-bottom:16px"></div>
          <div style="height:9px;width:88%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:82%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:91%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:68%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
        </div>
      </div>
    </div>
    <div class="card-body"><h3>A · 窄条入口（推荐）</h3><p>保留一个 42px 入口，点击即可恢复章节列表；当前章节仍有明确位置。</p></div>
  </div>

  <div class="card" data-choice="hidden" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:0;background:#f7f3eb">
      <div style="height:220px;position:relative;border:1px solid #d9d0c2;border-radius:10px;overflow:hidden;background:#fffdf8;padding:16px 18px">
        <div style="position:absolute;left:12px;top:12px;width:26px;height:26px;border:1px solid #b6c3d2;border-radius:7px;background:#eef4fa"></div>
        <div style="height:12px;width:46%;border-radius:8px;background:#d8e2ee;margin:10px 0 16px 42px"></div>
        <div style="height:9px;width:88%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
        <div style="height:9px;width:82%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
        <div style="height:9px;width:91%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
        <div style="height:9px;width:68%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
      </div>
    </div>
    <div class="card-body"><h3>B · 完全隐藏</h3><p>正文获得最大宽度，只留下一个浮动按钮；适合长时间连续写作。</p></div>
  </div>

  <div class="card" data-choice="title-rail" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:0;background:#f7f3eb">
      <div style="height:220px;display:flex;border:1px solid #d9d0c2;border-radius:10px;overflow:hidden;background:#fffdf8">
        <div style="width:78px;background:#f0ebe1;border-right:1px solid #d9d0c2;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:12px;color:#68758c;text-align:center">
          <div style="width:26px;height:26px;border:2px solid #68758c;border-radius:7px"></div>
          <div style="font-size:11px;line-height:1.4">第 1 章<br/>局内公频开骂</div>
          <div style="font-size:18px">›</div>
        </div>
        <div style="flex:1;padding:16px 18px;background:#fffdf8">
          <div style="height:12px;width:46%;border-radius:8px;background:#d8e2ee;margin-bottom:16px"></div>
          <div style="height:9px;width:88%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:82%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:91%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
          <div style="height:9px;width:68%;border-radius:8px;background:#d8d4ce;margin:11px 0"></div>
        </div>
      </div>
    </div>
    <div class="card-body"><h3>C · 保留章节标题栏</h3><p>保留当前章节标题和展开按钮，切换章节时更有方向感，但正文让出的宽度略少。</p></div>
  </div>
</div>

<div class="section" style="margin-top:1.25rem"><p class="subtitle">建议默认采用 A：不会让用户迷路，也能明显扩大正文区域。</p></div>
