<!--
  织章 · StoryFabric 应用图标
  寓意：一本摊开的书，一条金色丝带从书页间穿过——「织入书页的章节标记」。
  书脊上的三道针脚呼应「织」，丝带即「章」（标记章节的书签）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sf-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块，品牌靛蓝渐变 -->
  <rect width="512" height="512" rx="112" fill="url(#sf-bg)"/>

  <!-- 金色丝带·上段：从书页上方垂下、没入书页之后 -->
  <path d="M300 80 H344 V188 H300 Z" fill="url(#sf-ribbon)"/>

  <!-- 金色丝带·下段：从书页下方穿出、末端剪出燕尾缺口 -->
  <path d="M300 336 H344 V436 L322 410 L300 436 Z" fill="url(#sf-ribbon)"/>

  <!-- 摊开的书（绘制于丝带之上，形成「穿入书页」的层叠关系） -->
  <path d="M84 206 C142 174 204 170 250 194 L250 372 C204 350 142 354 84 384 Z" fill="#ffffff"/>
  <path d="M428 206 C370 174 308 170 262 194 L262 372 C308 350 370 354 428 384 Z" fill="#ffffff"/>

  <!-- 书脊针脚：三道斜向线迹，点出「织」的主题 -->
  <g stroke="#a5b4fc" stroke-width="13" stroke-linecap="round">
    <path d="M232 240 L280 258"/>
    <path d="M232 296 L280 314"/>
    <path d="M232 352 L280 370"/>
  </g>
</svg>
