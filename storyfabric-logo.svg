<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26345C"/>
      <stop offset="0.5" stop-color="#1C2749"/>
      <stop offset="1" stop-color="#141D3A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D28A"/>
      <stop offset="0.5" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B8862E"/>
    </linearGradient>
    <pattern id="fabric" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2 H12" stroke="#3A4C82" stroke-width="1.3" opacity="0.28"/>
      <path d="M2 0 V12" stroke="#2B3A67" stroke-width="1.1" opacity="0.38"/>
    </pattern>
  </defs>

  <!-- 织物底 -->
  <rect x="30" y="30" width="280" height="280" rx="22" fill="url(#cloth)"/>
  <rect x="30" y="30" width="280" height="280" rx="22" fill="url(#fabric)"/>
  <rect x="30" y="30" width="280" height="280" rx="22" fill="none" stroke="#0E1730" stroke-width="3"/>

  <!-- 淡纬线 -->
  <path d="M78 138 C 126 133, 166 142, 262 137" fill="none" stroke="#3A4C82" stroke-width="2.4" opacity="0.45"/>
  <path d="M78 202 C 126 197, 166 206, 262 201" fill="none" stroke="#3A4C82" stroke-width="2.4" opacity="0.45"/>

  <!-- 跑针线迹框 -->
  <rect x="58" y="58" width="224" height="224" rx="10" fill="none" stroke="#EFC97B" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.8"/>

  <!-- 金线绣 S -->
  <g transform="translate(170,166) scale(0.8) translate(-121,-170)">
    <path d="M186 100 C 152 70, 88 78, 82 126 C 77 168, 138 168, 156 198 C 176 232, 128 270, 80 248 C 68 242, 60 230, 56 218" fill="none" stroke="#101A33" stroke-width="17" stroke-linecap="round"/>
    <path d="M186 100 C 152 70, 88 78, 82 126 C 77 168, 138 168, 156 198 C 176 232, 128 270, 80 248 C 68 242, 60 230, 56 218" fill="none" stroke="#6E4F1A" stroke-width="12" stroke-linecap="round" transform="translate(2.5,3)"/>
    <path d="M186 100 C 152 70, 88 78, 82 126 C 77 168, 138 168, 156 198 C 176 232, 128 270, 80 248 C 68 242, 60 230, 56 218" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <path d="M186 100 C 152 70, 88 78, 82 126 C 77 168, 138 168, 156 198 C 176 232, 128 270, 80 248 C 68 242, 60 230, 56 218" fill="none" stroke="#FFF6DC" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 16" opacity="0.55"/>
  </g>

  <!-- 起针线结 -->
  <circle cx="222" cy="87" r="4" fill="#D9A441"/>

  <!-- 丝带书签 -->
  <path d="M232 30 H256 V110 L244 97 L232 110 Z" fill="#D9A441"/>
  <path d="M232 30 H256 V40 H232 Z" fill="#B8862E"/>
  <line x1="250" y1="44" x2="250" y2="98" stroke="#B8862E" stroke-width="2" opacity="0.55"/>
</svg>
