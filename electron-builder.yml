appId: com.storyfabric.app
productName: StoryFabric
directories:
  output: release/${version}
extraResources:
  - from: resources/icon.ico
    to: icon.ico
files:
  - out/**
  - package.json
  - '!node_modules/**/android/**'
  - '!node_modules/**/ios/**'
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: resources/icon.ico
  artifactName: StoryFabric-Portable-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: StoryFabric-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: StoryFabric
