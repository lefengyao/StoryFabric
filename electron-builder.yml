appId: com.storyfabric.app
productName: StoryFabric
directories:
  output: release
extraResources:
  - from: resources/icon.ico
    to: icon.ico
files:
  - out/**
  - package.json
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: StoryFabric
